[workspace]
authors = ["AAV 2026-27 team"]
channels = ["robostack-jazzy", "conda-forge"]
name = "aav"
platforms = [
  "linux-64",
  # The car's ARM computers (Orin, Pis), for Jazzy on their Ubuntu 22.04 without a reflash.
  "linux-aarch64",
  # Macs need macOS 14 (Sonoma) or newer: RoboStack's Nav2 is built for it.
  { name = "mac", platform = "osx-arm64", macos = "14.0" },
  { name = "mac-intel", platform = "osx-64", macos = "14.0" },
]
version = "0.1.0"

[tasks]
# One word per job. Run from the repository root: `pixi run <task>`.
build = { cmd = "colcon build --symlink-install", description = "Compile our ROS packages" }
test = { cmd = "tools/test.sh && tools/lint.sh && colcon test --event-handlers console_cohesion- && colcon test-result --verbose", depends-on = ["build"], description = "All tests, and the style check" }
lint = { cmd = "tools/lint.sh", description = "Check our Python against ROS's style rules" }
turtle = { cmd = "tools/ros.sh --local ros2 launch aav_bringup turtle.launch.py", description = "turtlesim as the car (this computer only)" }
keyboard = { cmd = "tools/ros.sh tools/keyboard.sh", description = "Drive from the keyboard (second terminal)" }
actuator-test = { cmd = "tools/actuator_test.sh", description = "The actuator tests, stages 3-4: pixi run actuator-test --list; <test> --sim in Gazebo (this computer only); <test> [--stands] on the car (docs/actuator-tests.md)" }
goto = { cmd = "tools/goto.sh", description = "Drive to one point and stop there smoothly: pixi run goto --sim --ahead 20 (Gazebo, this computer only); --lat L --lon L or --x X --y Y; on the car without --sim, it asks first (READ-ME-A-TO-B.md)" }
sim = { cmd = "tools/ros.sh --local ros2 launch aav_bringup sim.launch.py", description = "Gazebo as the car (this computer only)" }
bench = { cmd = "tools/ros.sh --local ros2 launch aav_bringup bench.launch.py", description = "The real car's software, with stand-ins for the hardware (bench mode, this computer only)" }
bench-check = { cmd = "tools/ros.sh --local python3 tools/bench_check.py", description = "Start bench mode and test the whole car graph: contract, drive, e-stops (2 min)" }
sim-check = { cmd = "tools/ros.sh --local python3 tools/sim_check.py", description = "Start Gazebo's road world headless and test the car's whole graph in it: contract, sensors, a drive (2 min); --perception (with -e ml), --obstacle, --lidar-obstacle, --plan-around, --ghost, --faults, --lane add more" }
controller-compare = { cmd = "tools/ros.sh --local python3 tools/controller_compare.py", description = "Drive Regulated Pure Pursuit and MPPI over the same routes in Gazebo's test lot, headless, and compare them: time, how far off the path, steering work, the box in the lane, CPU (about 15 min; --tours, --controllers, --speed; docs/controllers.md)" }
timing-test = { cmd = "tools/ros.sh --local python3 tools/timing_test.py", description = "Are messages on time? Gazebo's test lot headless, 5 min parked then 5 min driving Nav2's lot tour: each key topic's worst gap and late messages, topics quiet together, watchdog STALEs, CPU (AAV_RMW=fastdds to compare; --parked 60 --driving 60; docs/mac.md)" }
sim-fault = { cmd = "tools/ros.sh --local tools/sim_fault.sh", description = "Make a Gazebo sensor fail on purpose next to pixi run sim: sim-fault gps stop, sim-fault gps ok (gps, imu, odom, radar, camera; stop, freeze, nan, jump)" }
carla-car = { cmd = "tools/ros.sh --local ros2 launch aav_bringup carla.launch.py", description = "CARLA as the car: pixi run carla-car host:=<the CARLA computer> [town:=Town10HD_Opt] [osm:=maps/carla/carleton.osm]. Linux x86_64 with CARLA's Python client; ROS stays on this computer, CARLA can be anywhere (docs/carla.md)" }
ghost = { cmd = "tools/ros.sh ros2 run aav_ghost ghost", description = "A pretend person in Nav2's view, with sim or car ghost:=true: pixi run ghost ahead 10 (m past the bumper), ghost at 20 0 (map x y), ghost size 0.3 1.2, ghost off; ghost --local ... for Gazebo on this computer (docs/ghost-obstacles.md)" }
car = { cmd = "tools/ros.sh ros2 launch aav_bringup car.launch.py machine:={{ machine }}", args = [{ arg = "machine", default = "all" }], description = "The real car: pixi run car orin (or motor_pi, laptop, all)" }
view = { cmd = "tools/ros.sh --local ros2 launch aav_description view.launch.py", description = "The car model in RViz (this computer only)" }
bandwidth = { cmd = "tools/ros.sh python3 tools/bandwidth.py", description = "Measure every topic of a running system: Hz, message size, MB/s, as one table, biggest first (--seconds 30, --include /sensors, --markdown; docs/bandwidth.md)" }
can-load = { cmd = "python3 tools/can_load.py", description = "How busy the CAN bus is: every frame in firmware/can/aav.dbc, its size and rate, and the bus load at its bitrate (docs/bandwidth.md)" }
graph = { cmd = "tools/ros.sh rqt_graph", description = "Live picture of nodes and topics" }
graph-picture = { cmd = "tools/ros.sh python3 tools/graph_picture.py", description = "Save the running graph as docs/img/graph.svg and .png (start a profile first)" }
check = { cmd = "tools/ros.sh python3 tools/check_graph.py --profile {{ profile }}", args = [{ arg = "profile", default = "turtle" }], description = "Running graph vs the contract: pixi run check [turtle|sim|road|spine|car|replay|bench]" }
rviz = { cmd = "tools/ros.sh rviz2 -d src/aav_bringup/rviz/drive.rviz", description = "RViz with the driving layout: map, costmaps, path, car" }
estop = { cmd = 'tools/ros.sh ros2 topic pub -t 5 -r 10 /safety/estop std_msgs/msg/Bool "{data: true}"', description = "E-stop: block every driver (the car brakes)" }
estop-clear = { cmd = 'tools/ros.sh ros2 topic pub -t 5 -r 10 /safety/estop std_msgs/msg/Bool "{data: false}"', description = "Clear the e-stop" }
gz-window = { cmd = "tools/ros.sh tools/gz_window.sh", description = "Gazebo's window again, following the car, for a simulator already running" }
doctor = { cmd = "tools/ros.sh python3 tools/doctor.py", description = "Can this computer join the car's ROS network? Says what to fix" }
shm-clean = { cmd = "fastdds shm clean", description = "Remove Fast DDS shared-memory files left by ROS programs that died (only with AAV_RMW=fastdds; Cyclone, the default, leaves none): nodes that hang at start-up, or a sim that never spawns the car (docs/run.md)" }
net-map = { cmd = "bash tools/net_map.sh", description = "Map the network you're on: every machine, its maker (a guess), open ports, and the ROS domains heard. Read-only; no ROS needed" }
survey = { cmd = "bash tools/survey_car.sh", description = "Survey every car computer in a hosts file over ssh, read-only: pixi run survey ~/aav-audit/hosts.txt (FRIDAY-TODO.md)" }
layout-check = { cmd = "python3 tools/layout_check.py", description = "Is every topic in our Lichtblick layout served by a foxglove_bridge? pixi run layout-check ws://192.168.1.140:8765 (default: the sim on this computer)" }
car-kit = { cmd = "tools/car_kit.sh", description = "Make car-kit/, to install our Jazzy on the car's ARM computers from a USB stick, offline (docs/car-install.md; about 2 GB)" }
vendor = { cmd = "python3 tools/vendor.py", description = "Download the ROS 2 and ros2-rust source into vendor/, to look things up (not ours; about 560 MB)" }
get-models = { cmd = "tools/get_models.sh", description = "Download the stock YOLO model into models/ (for pixi run detect)" }
get-hud-map = { cmd = "tools/get_hud_map.sh", description = "Download the place database (51 MB, OpenStreetMap) into maps/places/ for the map window's place search, linked into hud/flutter_pi/assets/databases/ for the Flutter app" }
get-street-map = { cmd = "tools/get_street_map.sh", description = "Download the map window's offline street map of Ottawa (40 MB of OpenStreetMap vector tiles, from Protomaps) into maps/streets/" }
get-carla-osm = { cmd = "tools/get_carla_osm.sh", description = "Download Carleton's OpenStreetMap data round our datum into maps/carla/, for a CARLA map of the campus: pixi run get-carla-osm [--roads] (docs/carla.md)" }
get-flutter = { cmd = "tools/get_flutter.sh", description = "Download Flutter 3.35.7 into vendor/flutter (about 4.3 GB), for the HUD app" }
flutter = { cmd = "../../tools/flutter.sh", cwd = "hud/flutter_pi", description = "Flutter from vendor/flutter, in hud/flutter_pi: pixi run flutter doctor" }
hud-test = { cmd = "tools/hud_test.sh", description = "The HUD app: flutter pub get, analyze and test (needs pixi run get-flutter)" }
# The HUD in Rust and raylib (docs/hud.md). hud-demo needs no ROS: pretend data.
hud = { cmd = "tools/ros.sh ros2 launch aav_hud_raylib hud.launch.py", description = "The in-car screen (raylib), as the ROS node hud: pixi run hud fullscreen:=true" }
hud-demo = { cmd = "cargo run --release -q --locked --manifest-path src/hud/aav_hud_raylib/Cargo.toml -p hud-app --no-default-features -- --demo", description = "The in-car screen with pretend data: no ROS, no car" }
# The big screen's map window, the same way: map-demo needs no ROS.
map = { cmd = "tools/ros.sh ros2 launch aav_hud_raylib map.launch.py", description = "The big screen's map window (raylib), as the ROS node map: pixi run map fullscreen:=true" }
map-demo = { cmd = "cargo run --release -q --locked --manifest-path src/hud/aav_hud_raylib/Cargo.toml -p map-app --no-default-features -- --demo", description = "The map window with pretend data: no ROS, no car" }
rust-listener ={ cmd = "tools/ros.sh cargo run -q --manifest-path examples/rust-listener/Cargo.toml", description = "A Rust (rclrs) node: prints ego's commands" }
# The spine's board program, for a Pico 2 (docs/rust-firmware.md). spine-uf2 only makes a
# file; spine-flash writes to a Pico 2, through a debug probe, so run it only on the bench.
spine-uf2 = { cmd = "cargo build --release --locked && python3 ../../../../tools/elf2uf2.py target/thumbv8m.main-none-eabihf/release/spine-pico2 spine-pico2.uf2", cwd = "firmware/spine/boards/pico2", description = "Build the spine's Pico 2 program as firmware/spine/boards/pico2/spine-pico2.uf2: hold BOOTSEL, plug in, drag it on" }
spine-tools = { cmd = "cargo install --locked --root vendor/cargo-tools probe-rs-tools@0.32.0", description = "Install probe-rs 0.32.0 into vendor/cargo-tools/bin, to flash a Pico 2 through a debug probe (once; several minutes)" }
spine-flash = { cmd = "cargo build --release --locked && ../../../../vendor/cargo-tools/bin/probe-rs run --chip RP235x target/thumbv8m.main-none-eabihf/release/spine-pico2", cwd = "firmware/spine/boards/pico2", description = "Flash the spine's program onto a Pico 2 through a debug probe, then show its logs (pixi run spine-tools first)" }
# The wheel encoder's Pico 2 (with a W5500), the Rust version of the 2025-26 one. The same
# pair: wheel-uf2 only makes a file; wheel-flash writes to a board through a probe.
wheel-uf2 = { cmd = "cargo build --release --locked && python3 ../../../../tools/elf2uf2.py target/thumbv8m.main-none-eabihf/release/wheel-encoder-pico2 wheel-encoder-pico2.uf2", cwd = "firmware/spine/boards/wheel-encoder-pico2", description = "Build the wheel encoder's Pico 2 program as firmware/spine/boards/wheel-encoder-pico2/wheel-encoder-pico2.uf2: hold BOOTSEL, plug in, drag it on" }
wheel-flash = { cmd = "cargo build --release --locked && ../../../../vendor/cargo-tools/bin/probe-rs run --chip RP235x target/thumbv8m.main-none-eabihf/release/wheel-encoder-pico2", cwd = "firmware/spine/boards/wheel-encoder-pico2", description = "Flash the wheel encoder's program onto its Pico 2 through a debug probe, then show its logs (pixi run spine-tools first)" }
# The status display's Pico 2 (the sentinel), the Rust version of the 2025-26 one.
sentinel-uf2 = { cmd = "cargo build --release --locked && python3 ../../../../tools/elf2uf2.py target/thumbv8m.main-none-eabihf/release/sentinel-pico2 sentinel-pico2.uf2", cwd = "firmware/spine/boards/sentinel-pico2", description = "Build the status display's Pico 2 program as firmware/spine/boards/sentinel-pico2/sentinel-pico2.uf2: hold BOOTSEL, plug in, drag it on" }
sentinel-flash = { cmd = "cargo build --release --locked && ../../../../vendor/cargo-tools/bin/probe-rs run --chip RP235x target/thumbv8m.main-none-eabihf/release/sentinel-pico2", cwd = "firmware/spine/boards/sentinel-pico2", description = "Flash the status display's program onto its Pico 2 through a debug probe, then show its logs (pixi run spine-tools first)" }
# The spine on today's ESP32 control board, in Rust (docs/rust-firmware.md). The ESP32 is
# Xtensa: esp-tools installs Espressif's Rust for this user (needs rustup), once.
# esp-flash writes to the car's control board: on the bench only, wheels off the ground.
esp-tools = { cmd = "tools/esp32.sh tools", description = "Install Espressif's Rust (Xtensa, into ~/.rustup/toolchains/esp) and espup + espflash (into vendor/cargo-tools/bin), for the ESP32 board (once; needs rustup; several minutes, about 1.5 GB)" }
esp-build = { cmd = "tools/esp32.sh build", description = "Build the Rust firmware for today's ESP32 control board (Motor-Pi UART link); add --no-default-features --features can for CAN" }
esp-flash = { cmd = "tools/esp32.sh flash", description = "Build and flash the Rust firmware onto the ESP32 control board on the USB cable, then show its log (bench only: docs/esp32-bench.md)" }

[dependencies]
ros-jazzy-desktop = ">=0.11.0,<0.12"
ros-jazzy-turtlesim = ">=1.8.4,<2"
ros-jazzy-teleop-twist-keyboard = ">=2.4.1,<3"
ros-jazzy-teleop-twist-joy = ">=2.6.5,<3"
ros-jazzy-joy = ">=3.3.0,<4"
ros-jazzy-twist-mux = ">=4.5.0,<5"
ros-jazzy-robot-localization = ">=3.8.3,<4"
ros-jazzy-navigation2 = ">=1.3.13,<2"
ros-jazzy-imu-filter-madgwick = ">=2.1.6,<3"
ros-jazzy-ackermann-msgs = ">=2.0.2,<3"
ros-jazzy-xacro = ">=2.1.1,<3"
ros-jazzy-robot-state-publisher = ">=3.3.4,<4"
ros-jazzy-joint-state-publisher = ">=2.4.3,<3"
ros-jazzy-joint-state-publisher-gui = ">=2.4.3,<3"
ros-jazzy-rosbag2-storage-mcap = ">=0.26.11,<0.27"
colcon-common-extensions = ">=0.3.0,<0.4"
compilers = ">=2.0.0,<3"
cmake = ">=4.4.4,<5"
pkg-config = ">=0.29.2,<0.30"
ninja = ">=1.13.2,<2"
make = ">=4.4.1,<5"
pytest = ">=9.1.1,<10"
pyyaml = ">=6.0.3,<7"
pyserial = ">=3.5,<4"
ros-jazzy-joy-teleop = ">=2.0.0,<3"
ros-jazzy-ros-gz = ">=1.0.24,<2"
ros-jazzy-can-msgs = ">=2.0.0,<3"
ros-jazzy-foxglove-bridge = ">=3.6.0,<4"
ros-jazzy-rosbridge-server = ">=2.7.1,<3"
ros-jazzy-nmea-navsat-driver = ">=2.0.1,<3"
# The stock u-blox driver (KumarRobotics), so the GPS runs in Pixi on every machine.
# ublox_dgnss, the 2024-25 choice, is apt-only (Q18).
ros-jazzy-ublox = ">=2.3.0,<3"
ros-jazzy-rqt-tf-tree = ">=1.1.1,<2"
rust = ">=1.98.1,<1.99"
# The firmware's microcontroller targets: Pico 2 (RP2350) and STM32-class Cortex-M4F/M7.
"rust-std-thumbv8m.main-none-eabihf" = ">=1.98.1,<1.99"
rust-std-thumbv7em-none-eabihf = ">=1.98.1,<1.99"
flask = ">=3.1.3,<4"
flask-socketio = ">=5.7.0,<6"
scipy = ">=1.18.1,<2"
ros-jazzy-topic-tools = ">=1.3.4,<2"
# Perception: camera images and detections. The radar's clustering (aav_radar_clusters,
# Rust) needs no PCL: PCL, octomap and backward_ros went with the C++ one.
ros-jazzy-vision-msgs = ">=4.1.1,<5"
ros-jazzy-cv-bridge = ">=4.1.0,<5"
ros-jazzy-image-publisher = ">=5.0.13,<6"
ros-jazzy-camera-info-manager = ">=5.1.8,<6"
ros-jazzy-velodyne = ">=2.5.1,<3"

[target.linux.dependencies]   # SocketCAN and usb_cam are Linux-only
ros-jazzy-ros2-socketcan = ">=1.4.0,<2"
ros-jazzy-usb-cam = ">=0.8.1,<0.9"

# Macs: colcon test reads each package's environment through `env`. Apple's /usr/bin/env
# drops DYLD_LIBRARY_PATH (System Integrity Protection), so tests can't load our messages.
# GNU env keeps it.
[target.osx.dependencies]
coreutils = ">=9.12,<10"

# Macs: the ROS libraries are built for macOS 14, and Rust aims at macOS 11 unless told,
# so every Rust link warned. pixi.toml already needs macOS 14 (see platforms above).
# ROS's messages go through Cyclone DDS on every computer (Ben, 23 Oct). On a Mac beside
# Gazebo, Fast DDS delivered some up to 0.48 s late; Cyclone never over 0.05 s (docs/mac.md).
# Every computer that talks to another must use the same one. AAV_RMW=fastdds (tools/ros.sh)
# goes back to Fast DDS for one run. Cyclone comes with ros-jazzy-desktop.
[activation.env]
RMW_IMPLEMENTATION = "rmw_cyclonedds_cpp"

[target.osx.activation.env]
MACOSX_DEPLOYMENT_TARGET = "14.0"

[feature.docs.dependencies]
markdown = ">=3.11,<4"
pymdown-extensions = ">=12.1,<13"
weasyprint = ">=69.0,<70"

[feature.docs.tasks]
docs = { cmd = "python tools/build_docs.py", description = "Rebuild the HTML docs and the PDFs" }

# Machine learning for the perception nodes: PyTorch and Ultralytics (YOLO). A separate
# environment, so the default one stays small: `pixi run detect`, or `pixi run -e ml ...`.
# Macs run PyTorch on the GPU through Metal ("mps"); Core ML is TensorRT's equivalent there.
# The Orin gets CUDA and TensorRT from JetPack instead (docs/perception.md).
[feature.ml]
platforms = ["linux-64", "mac"]

[feature.ml.dependencies]
pytorch = ">=2.13,<3"
torchvision = ">=0.28,<1"
ultralytics = ">=8.4.175,<9"
rfdetr = ">=1.11,<2"   # RF-DETR (Roboflow, Apache-2.0): S6, docs/model-comparison.md
numpy = ">=2,<=2.3.5"   # Ultralytics' Core ML export fails on NumPy 2.4 and newer

[feature.ml.tasks]
detect = { cmd = "tools/ros.sh ros2 launch aav_yolo detector.launch.py", description = "The object detector on the camera's images: RF-DETR, or YOLO with detector:=yolo. pixi run detect picture:=<file> to try a picture" }
laptop-bench = { cmd = "tools/ros.sh --local ros2 launch aav_bringup car.launch.py machine:=laptop", description = "Your laptop's parts, its own detector too, against bench mode on this computer (pixi run bench first, in another terminal)" }

[feature.ml.target.osx.dependencies]
coremltools = ">=9.0,<10"

# Core ML is a Mac's: the export makes models/yolo11n.mlpackage next to the .pt. On an
# M4 Max the export takes 2 s, and the whole task 3 to 10 s. The Orin's TensorRT engine is
# made on the Orin itself, with JetPack's Python: tools/build_engine.py.
[feature.ml.target.osx.tasks]
export-coreml = { cmd = "yolo export model={{ model }} format=coreml", args = [{ arg = "model", default = "models/yolo11n.pt" }], depends-on = ["get-models"], description = "Make the Core ML model for a Mac: pixi run -e ml export-coreml [models/<name>.pt]" }

[feature.ml.activation.env]
PYTORCH_ENABLE_MPS_FALLBACK = "1"   # conda-forge's torchvision has no Metal NMS: that step runs on the CPU
YOLO_AUTOINSTALL = "false"          # Ultralytics must never pip-install into the environment

# The MCP server (tools/mcp_server.py): Claude, or another AI app, can read the docs, the
# contract and the live ROS graph. Read-only (docs/mcp.md). Its own environment, so the
# car's stays small. An AI app starts it through .mcp.json: pixi run -e mcp mcp
[feature.mcp.dependencies]
mcp = ">=2.3.0,<3"

[feature.mcp.tasks]
mcp = { cmd = "tools/ros.sh python3 tools/mcp_server.py", description = "The read-only MCP server, for Claude or another AI app (started by the app, through .mcp.json)" }
drive-server = { cmd = "tools/ros.sh --local python3 -m aav_language.drive_server", description = "The DRIVE tool server (MCP over stdio): drive, turn, stop, with hard limits. Turtle, sim or bench only, unless --car (docs/plain-english.md)" }

# Plain-English driving (docs/plain-english.md): a local language model, through Apple's
# MLX, turns "drive 10 m forward" into calls to the drive server (aav_language). Macs with
# Apple silicon only: MLX needs Metal. mlx and mlx-lm are MIT licensed. The models
# download into the Hugging Face cache (~/.cache/huggingface).
[feature.llm]
platforms = ["mac"]

# From PyPI: conda-forge's mlx needs macOS 14.5, and this workspace promises 14.0.
[feature.llm.pypi-dependencies]
mlx-lm = ">=0.32.0,<0.33"

[feature.llm.tasks]
talk = { cmd = "tools/ros.sh --local python3 -m aav_language.agent", description = "Tell the car what to do in plain English: a local model plans, you type yes (turtle, sim or bench only)" }
llm-eval = { cmd = "tools/ros.sh python3 -m aav_language.run_eval", description = "Score local models on the plain-English test set, against a fake drive server (no ROS, no car)" }

# Street routes (docs/routes.md, PLAN S8): Valhalla (MIT), the offline router, from its
# own Python wheel, which carries valhalla_build_tiles and valhalla_service. Wheels exist
# for Linux (x86_64 and aarch64: the Jetson) and Apple-silicon Macs, not Intel Macs. Its
# own environment, so the car's stays small. The street data: OpenStreetMap (ODbL).
[feature.routes]
platforms = ["linux-64", "linux-aarch64", "mac"]

[feature.routes.dependencies]
python = ">=3.12,<3.13"

[feature.routes.pypi-dependencies]
pyvalhalla = "==3.9.1"

[feature.routes.tasks]
get-routes = { cmd = "tools/get_routes.sh", description = "Download OpenStreetMap's Ottawa (about 50 MB, from BBBike) into maps/routes/ and build Valhalla's street graph from it (a minute or two): pixi run -e routes get-routes" }
router = { cmd = "tools/router.sh", description = "Start the street router (Valhalla) on 127.0.0.1:8002, for street_route: pixi run -e routes router (pixi run -e routes get-routes first)" }

# Today's C++ boards (the 2025-26 ESP32 and Picos), until the Rust spine replaces them.
# PlatformIO builds and flashes them. Its own downloads (the ESP32 compilers and
# framework, about 1 GB) go into vendor/platformio, which git ignores. No ROS here.
[feature.firmware.dependencies]
python = ">=3.12,<3.13"
platformio = ">=6.2.0,<7"

[feature.firmware.activation.env]
PLATFORMIO_CORE_DIR = "$PIXI_PROJECT_ROOT/vendor/platformio"

[feature.firmware.tasks]
legacy-esp32 = { cmd = "tools/legacy_firmware.sh", description = "Build today's ESP32 firmware with PlatformIO: pixi run -e firmware legacy-esp32 (add -t upload to flash it)" }

[environments]
docs = { features = ["docs"], no-default-feature = true }
ml = { features = ["ml"] }
mcp = { features = ["mcp"] }
llm = { features = ["llm", "mcp"] }
firmware = { features = ["firmware"], no-default-feature = true }
routes = { features = ["routes"], no-default-feature = true }

