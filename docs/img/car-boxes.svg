<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 880" font-family="Verdana, 'DejaVu Sans', Arial, Helvetica, sans-serif" font-size="14">
  <title>The car, box by box: Ethernet on top for heavy data, CAN below for control, after the KEFC changes</title>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
    <style>
      .stock { fill:#F2F2F2; stroke:#999; stroke-width:1.2; }
      .new   { fill:#FFFFFF; stroke:#C8102E; stroke-width:2.2; }
      .ask   { fill:#FFFFFF; stroke:#999; stroke-width:1.3; stroke-dasharray:5 4; }
      .safe  { fill:#FDECEE; stroke:#C8102E; stroke-width:1.2; }
      .band  { fill:#F2F2F2; stroke:#555; stroke-width:1.5; }
      .t  { fill:#222; font-weight:bold; font-size:15px; }
      .s  { fill:#555; font-size:12.5px; }
      .tag { fill:#C8102E; font-size:11px; font-weight:bold; }
      .layer { fill:#C8102E; font-size:13px; font-weight:bold; letter-spacing:1px; }
      .eth { stroke:#555; stroke-width:1.8; fill:none; }
      .can { stroke:#C8102E; stroke-width:6; fill:none; stroke-linecap:round; }
      .canstub { stroke:#C8102E; stroke-width:3; fill:none; }
      .wire { stroke:#555; stroke-width:1.6; fill:none; stroke-dasharray:6 4; marker-end:url(#arr); }
      .today { stroke:#999; stroke-width:1.6; fill:none; stroke-dasharray:2 4; }
    </style>
  </defs>

  <!-- ===== ETHERNET: devices ===== -->
  <text class="layer" x="18" y="24">ETHERNET: HEAVY DATA (cameras, lidar, GPS, screens)</text>

  <rect class="stock" x="18"  y="36" width="100" height="66" rx="8"/>
  <text class="t" x="68"  y="62" text-anchor="middle">Cam1 Pi 5</text>
  <text class="s" x="68"  y="82" text-anchor="middle">front camera</text>

  <rect class="stock" x="126" y="36" width="100" height="66" rx="8"/>
  <text class="t" x="176" y="62" text-anchor="middle">Cam2 Pi 5</text>
  <text class="s" x="176" y="82" text-anchor="middle">front camera</text>

  <rect class="new"   x="234" y="36" width="100" height="66" rx="8"/>
  <text class="t" x="284" y="62" text-anchor="middle">Cam3 Pi 5</text>
  <text class="s" x="284" y="82" text-anchor="middle">rear camera</text>
  <text class="tag" x="284" y="97" text-anchor="middle">NEW</text>

  <rect class="stock" x="342" y="36" width="100" height="66" rx="8"/>
  <text class="t" x="392" y="62" text-anchor="middle">LiDAR</text>
  <text class="s" x="392" y="82" text-anchor="middle">roof · no driver</text>

  <rect class="stock" x="450" y="36" width="100" height="66" rx="8"/>
  <text class="t" x="500" y="62" text-anchor="middle">RTK-Pi</text>
  <text class="s" x="500" y="82" text-anchor="middle">ZED-F9R GPS</text>
  <text class="tag" x="500" y="97" text-anchor="middle">NEW BOARD</text>

  <rect class="stock" x="558" y="36" width="100" height="66" rx="8"/>
  <text class="t" x="608" y="62" text-anchor="middle">Dash UI</text>
  <text class="s" x="608" y="82" text-anchor="middle">the HUD</text>

  <rect class="stock" x="666" y="36" width="100" height="66" rx="8"/>
  <text class="t" x="716" y="62" text-anchor="middle">Router</text>
  <text class="s" x="716" y="82" text-anchor="middle">WiFi: laptops</text>

  <rect class="ask"   x="774" y="36" width="100" height="66" rx="8"/>
  <text class="t" x="824" y="62" text-anchor="middle">ES-Pi</text>
  <text class="s" x="824" y="82" text-anchor="middle">role: ask</text>

  <rect class="ask"   x="882" y="36" width="100" height="66" rx="8"/>
  <text class="t" x="932" y="62" text-anchor="middle">QNX-Pi</text>
  <text class="s" x="932" y="82" text-anchor="middle">role: ask</text>

  <!-- drops to the switch -->
  <path class="eth" d="M68,102 V150 M176,102 V150 M284,102 V150 M392,102 V150 M500,102 V150 M608,102 V150 M716,102 V150 M824,102 V150 M932,102 V150"/>

  <!-- the switch -->
  <rect class="band" x="18" y="150" width="964" height="46" rx="10"/>
  <text class="t" x="500" y="171" text-anchor="middle">Switch: TP-Link TL-SG116E, 16 Ethernet ports</text>
  <text class="s" x="500" y="188" text-anchor="middle">behind the seat · every box on it can talk ROS 2 to every other</text>

  <!-- ===== THE TWO ORINS ===== -->
  <text class="layer" x="18" y="232">THE BRAINS</text>
  <path class="eth" d="M260,196 V248 M740,196 V248"/>

  <rect class="stock" x="130" y="248" width="260" height="84" rx="8"/>
  <text class="t" x="260" y="274" text-anchor="middle">Jetson AGX Orin #1</text>
  <text class="s" x="260" y="294" text-anchor="middle">EKFs · twist_mux · ego</text>
  <text class="s" x="260" y="312" text-anchor="middle">spine_bridge: the CAN master</text>

  <rect class="new" x="610" y="248" width="260" height="84" rx="8"/>
  <text class="t" x="740" y="274" text-anchor="middle">Jetson AGX Orin #2</text>
  <text class="s" x="740" y="294" text-anchor="middle">cameras + lidar · costmaps · Nav2</text>
  <text class="tag" x="740" y="314" text-anchor="middle">NEW (64 GB)</text>

  <!-- IMU on USB -->
  <rect class="stock" x="18" y="256" width="92" height="68" rx="8"/>
  <text class="t" x="64" y="282" text-anchor="middle">IMU</text>
  <text class="s" x="64" y="300" text-anchor="middle">Yahboom</text>
  <text class="s" x="64" y="316" text-anchor="middle">USB</text>
  <path class="wire" d="M110,290 H128"/>

  <!-- CAN Pal -->
  <rect class="new" x="200" y="352" width="120" height="34" rx="6"/>
  <text class="t" x="260" y="374" text-anchor="middle">CAN Pal</text>
  <path class="canstub" d="M260,332 V352 M260,386 V420"/>

  <!-- ===== CAN BUS ===== -->
  <text class="layer" x="18" y="412">CAN: CONTROL</text>
  <path class="can" d="M60,428 H940"/>
  <text class="tag" x="940" y="414" text-anchor="end">NEW CAN BUS (KEFC) · 120 Ω at each end</text>
  <path class="canstub" d="M250,428 V470 M640,428 V470 M840,428 V470"/>

  <!-- control board -->
  <rect class="stock" x="60" y="470" width="400" height="104" rx="8"/>
  <text class="t" x="260" y="496" text-anchor="middle">AAV control board</text>
  <text class="s" x="260" y="516" text-anchor="middle">ESP32 MicroMod (CAN plug on the board)</text>
  <text class="s" x="260" y="534" text-anchor="middle">2 × Pololu Jrk G2 · throttle DAC</text>
  <text class="s" x="260" y="556" text-anchor="middle">today also: the Motor-Pi (Pi 4), UART to the ESP32</text>

  <!-- wheel nodes -->
  <rect class="new" x="560" y="470" width="160" height="104" rx="8"/>
  <text class="t" x="640" y="496" text-anchor="middle">Wheel node L</text>
  <text class="s" x="640" y="516" text-anchor="middle">ESP32-CAN-X2</text>
  <text class="s" x="640" y="534" text-anchor="middle">Hall sensor</text>
  <text class="tag" x="640" y="556" text-anchor="middle">NEW · 0x200</text>

  <rect class="new" x="760" y="470" width="160" height="104" rx="8"/>
  <text class="t" x="840" y="496" text-anchor="middle">Wheel node R</text>
  <text class="s" x="840" y="516" text-anchor="middle">ESP32-CAN-X2</text>
  <text class="s" x="840" y="534" text-anchor="middle">Hall sensor</text>
  <text class="tag" x="840" y="556" text-anchor="middle">NEW · 0x201</text>

  <!-- ===== ACTUATORS ===== -->
  <text class="layer" x="424" y="606">MOVING PARTS</text>
  <path class="wire" d="M120,574 V626"/>
  <path class="wire" d="M260,574 V626"/>
  <path class="wire" d="M400,574 V626"/>

  <rect class="stock" x="40" y="628" width="150" height="80" rx="8"/>
  <text class="t" x="115" y="654" text-anchor="middle">Steering</text>
  <text class="s" x="115" y="674" text-anchor="middle">actuator, Jrk #1</text>
  <text class="tag" x="115" y="694" text-anchor="middle">NEW KTC-100 pot</text>

  <rect class="stock" x="200" y="628" width="120" height="80" rx="8"/>
  <text class="t" x="260" y="654" text-anchor="middle">Brake</text>
  <text class="s" x="260" y="674" text-anchor="middle">actuator,</text>
  <text class="s" x="260" y="692" text-anchor="middle">Jrk #2</text>

  <rect class="stock" x="330" y="628" width="150" height="80" rx="8"/>
  <text class="t" x="405" y="654" text-anchor="middle">Motor</text>
  <text class="s" x="405" y="674" text-anchor="middle">controller, DAC</text>
  <text class="s" x="405" y="692" text-anchor="middle">rear-wheel drive</text>

  <!-- wheels -->
  <rect class="stock" x="560" y="628" width="360" height="80" rx="8"/>
  <text class="t" x="740" y="654" text-anchor="middle">Front wheels</text>
  <text class="s" x="740" y="674" text-anchor="middle">the Hall sensors count the holes</text>
  <text class="s" x="740" y="692" text-anchor="middle">in each brake rotor</text>
  <path class="wire" d="M640,626 V576"/>
  <path class="wire" d="M840,626 V576"/>

  <!-- ===== SAFETY ===== -->
  <rect class="safe" x="40" y="728" width="880" height="62" rx="10"/>
  <text class="t" x="480" y="754" text-anchor="middle">Beats all software: Kar-Tech wireless e-stop · red mushroom button · kill switch</text>
  <text class="s" x="480" y="774" text-anchor="middle">then the board's 100 ms timeout, its hardware watchdog, the Jrk timeouts, a pull-down on the throttle</text>

  <!-- ===== LEGEND ===== -->
  <rect class="stock" x="40"  y="812" width="34" height="22" rx="4"/>
  <text class="s" x="82"  y="828">on the car today</text>
  <rect class="new"   x="212" y="812" width="34" height="22" rx="4"/>
  <text class="s" x="254" y="828">new (KEFC request)</text>
  <rect class="ask"   x="400" y="812" width="34" height="22" rx="4"/>
  <text class="s" x="442" y="828">role unknown</text>
  <path class="eth" d="M560,823 H600"/>
  <text class="s" x="608" y="828">Ethernet</text>
  <path class="canstub" d="M690,823 H730"/>
  <text class="s" x="738" y="828">CAN</text>
  <path class="wire" d="M790,823 H830"/>
  <text class="s" x="838" y="828">USB or wires</text>
  <text class="s" x="40" y="862">Most of this is read from photos (14 Oct), not yet checked. Today the car drives through the Motor-Pi, not CAN.</text>
</svg>
